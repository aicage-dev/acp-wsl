name: Release
run-name: Release (${{ github.ref_name }})

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tagged-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}" >&2
            echo "is not on origin/${DEFAULT_BRANCH}." >&2
            exit 1
          fi

  test:
    needs: verify-tagged-commit
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux windows; do
            for arch in amd64 arm64; do
              extension=""
              if [[ "${os}" == windows ]]; then
                extension=.exe
              fi
              GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                -o "dist/acp-wsl-${os}-${arch}${extension}" \
                ./cmd/acp-path
            done
          done
          for arch in amd64 arm64; do
            archive_dir="$(mktemp -d)"
            cp "dist/acp-wsl-windows-${arch}.exe" "${archive_dir}/acp-wsl.exe"
            (
              cd "${archive_dir}"
              zip -q "${GITHUB_WORKSPACE}/dist/acp-wsl-windows-${arch}.zip" acp-wsl.exe
            )
            rm -rf "${archive_dir}"
          done

      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | \
            sort -z | \
            xargs -0 sha256sum \
            > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --generate-notes

  winget:
    needs: release
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'acp-wsl-release-assets'
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir $assetDirectory `
            --pattern acp-wsl-windows-amd64.zip
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir $assetDirectory `
            --pattern acp-wsl-windows-arm64.zip
          "WINGET_ASSET_DIRECTORY=$assetDirectory" >> $env:GITHUB_ENV

      - name: Generate WinGet manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'winget-manifest'
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          .github/scripts/New-WinGetManifest.ps1 `
            -Version $version `
            -ReleaseUrl $releaseUrl `
            -AssetDirectory $env:WINGET_ASSET_DIRECTORY `
            -OutputDirectory $manifestDirectory
          "WINGET_MANIFEST_DIRECTORY=$manifestDirectory" >> $env:GITHUB_ENV

      - name: Validate WinGet manifest
        shell: pwsh
        run: winget validate --manifest $env:WINGET_MANIFEST_DIRECTORY

      - name: Test WinGet installation
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install `
            --manifest $env:WINGET_MANIFEST_DIRECTORY `
            --accept-package-agreements `
            --disable-interactivity

      - name: Upload WinGet manifest
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifest-${{ github.ref_name }}
          path: ${{ env.WINGET_MANIFEST_DIRECTORY }}
          if-no-files-found: error
