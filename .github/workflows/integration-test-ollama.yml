name: Integration Tests (Ollama)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-ollama:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, opencode, vibe]
    env:
      OLLAMA_MODEL: granite4:micro
      WSLENV: OLLAMA_MODEL/u
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod

      - name: Set up WSL
        run: |
          wsl --install --distribution Ubuntu-26.04 --no-launch
          wsl --distribution Ubuntu-26.04 -- bash -lc 'apt-get update &&
            apt-get install -y curl ca-certificates xz-utils'

      - name: Install and start Ollama in WSL
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          wsl --distribution Ubuntu-26.04 -- "$root/integration/ollama/install-ollama.sh"

      - name: Pull Ollama model
        run: wsl --distribution Ubuntu-26.04 -- ollama pull "$env:OLLAMA_MODEL"

      - name: Set up Node.js in WSL
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          wsl --distribution Ubuntu-26.04 -- "$root/integration/ollama/install-node.sh"

      - name: Install Codex in WSL
        if: matrix.agent == 'codex'
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g @openai/codex @agentclientprotocol/codex-acp'

      - name: Install OpenCode in WSL
        if: matrix.agent == 'opencode'
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g opencode-ai'

      - name: Install Mistal Vibe in WSL
        if: matrix.agent == 'vibe'
        run: >
          wsl --distribution Ubuntu-26.04 -- bash -lc
          'export PATH="$HOME/.local/bin:$PATH"; curl -fsSL https://mistral.ai/vibe/install.sh | bash'

      - name: Smoke with Windows acp-wsl
        id: test_windows
        continue-on-error: true
        run: |
          go build -o "$env:GITHUB_WORKSPACE/acp-wsl-debug.exe" ./cmd/acp-wsl-debug
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          $env:ACP_PATH_SMOKE_ABSOLUTE_MARKER_PATH = "$root/testdata/acp-wsl-openrouter-absolute-smoke.txt"
          go -C integration/openrouter run . `
            -- "$env:GITHUB_WORKSPACE/acp-wsl-debug.exe" `
            --log-file "$env:GITHUB_WORKSPACE/acp-wsl-windows.log" `
            -- wsl --distribution Ubuntu-26.04 -- `
            "$root/integration/ollama/run-agent.sh" "${{ matrix.agent }}"

      - name: Smoke with WSL acp-wsl
        id: test_wsl
        continue-on-error: true
        run: |
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -o "$env:GITHUB_WORKSPACE/acp-wsl-debug" ./cmd/acp-wsl-debug
          Remove-Item Env:GOOS
          Remove-Item Env:GOARCH
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          $env:ACP_PATH_SMOKE_ABSOLUTE_MARKER_PATH = "$root/testdata/acp-wsl-openrouter-absolute-smoke.txt"
          go -C integration/openrouter run . `
            -- wsl --distribution Ubuntu-26.04 -- "$root/acp-wsl-debug" `
            --log-file "$root/acp-wsl-wsl.log" `
            -- "$root/integration/ollama/run-agent.sh" "${{ matrix.agent }}"

      - name: Upload acp-wsl logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acp-wsl-logs-ollama-${{ matrix.agent }}
          path: |
            acp-wsl-windows.log
            acp-wsl-wsl.log
          if-no-files-found: warn

      - name: Fail if tests failed
        if: >-
          always() && (steps.test_windows.outcome == 'failure' ||
          steps.test_wsl.outcome == 'failure')
        run: exit 1
