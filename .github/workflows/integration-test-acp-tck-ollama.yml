name: Integration Tests (ACP TCK with Ollama)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-acp-tck-ollama:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, opencode, vibe]
    env:
      OLLAMA_MODEL: qwen3:8b
      WSLENV: OLLAMA_MODEL/u
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Checkout agentclientprotocol/acp-tck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: agentclientprotocol/acp-tck
          # yamllint disable-line rule:line-length
          ref: 13b1dfbd0178819e9e49285642a94445b3a96423 # renovate: datasource=github-tags depName=agentclientprotocol/acp-tck versioning=semver currentValue=v0.1.0
          path: acp-tck

      - name: Set up WSL
        run: |
          wsl --install --distribution Ubuntu-26.04 --no-launch
          wsl --distribution Ubuntu-26.04 -- bash -lc 'apt-get update &&
            apt-get install -y curl ca-certificates xz-utils'

      - name: Install and start Ollama in WSL
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          wsl --distribution Ubuntu-26.04 -- "$root/integration/ollama/install-ollama.sh"

      - name: Pull Ollama model
        run: wsl --distribution Ubuntu-26.04 -- ollama pull "$env:OLLAMA_MODEL"

      - name: Set up Node.js in WSL
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          wsl --distribution Ubuntu-26.04 -- "$root/integration/ollama/install-node.sh"

      - name: Install Codex in WSL
        if: matrix.agent == 'codex'
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g @openai/codex @agentclientprotocol/codex-acp'

      - name: Install OpenCode in WSL
        if: matrix.agent == 'opencode'
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g opencode-ai'

      - name: Install Mistal Vibe in WSL
        if: matrix.agent == 'vibe'
        run: >
          wsl --distribution Ubuntu-26.04 -- bash -lc
          'export PATH="$HOME/.local/bin:$PATH"; curl -fsSL https://mistral.ai/vibe/install.sh | bash'

      - name: Run informational v1 TCK through Windows acp-wsl
        id: test
        continue-on-error: true
        run: |
          go build -o "$env:GITHUB_WORKSPACE/acp-wsl.exe" ./cmd/acp-wsl
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          $agentCwd = Join-Path $env:RUNNER_TEMP 'acp-tck-workspace'
          New-Item -ItemType Directory -Force -Path $agentCwd | Out-Null
          uv --project "$env:GITHUB_WORKSPACE/acp-tck" run acp-tck `
            --agent-cwd $agentCwd `
            --startup-timeout 120 --timeout 600 --test-timeout 900 `
            --report-json "$env:GITHUB_WORKSPACE/acp-tck-report.json" `
            -- "$env:GITHUB_WORKSPACE/acp-wsl.exe" `
            --log-file "$env:GITHUB_WORKSPACE/acp-tck-acp-wsl.log" `
            -- wsl --distribution Ubuntu-26.04 -- `
            "$root/integration/ollama/run-agent.sh" "${{ matrix.agent }}"

      - name: Upload TCK report and acp-wsl log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acp-tck-${{ matrix.agent }}
          path: |
            acp-tck-report.json
            acp-tck-acp-wsl.log
          if-no-files-found: warn

      - name: Fail if test failed
        if: always() && steps.test.outcome == 'failure'
        run: exit 1
